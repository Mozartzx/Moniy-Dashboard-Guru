name: Deploy

on:
  push:
    branches: [main]

concurrency: deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      # NEXT_PUBLIC_* are inlined at build time; without them proxy.ts and the login page throw on missing Supabase config
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      # ponytail: vinext 1.0.0-beta.5 standalone output omits its React peer deps; drop this once vinext copies them itself
      - run: cp -r node_modules/{react,react-dom,react-server-dom-webpack,scheduler} dist/standalone/node_modules/

      - name: Upload to VPS
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          echo "${{ secrets.VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519
          # ponytail: rsync over the live dir, a few seconds of mixed files mid-upload; switch to release dirs + symlink if that ever bites
          rsync -az --delete dist/standalone/ moniy@72.61.149.56:/var/www/moniy-dashboard/
          ssh moniy@72.61.149.56 sudo systemctl restart moniy-dashboard

      - name: Smoke test
        run: |
          for i in 1 2 3 4 5 6; do
            curl -fsS -o /dev/null https://moniy.site/ && exit 0
            sleep 5
          done
          exit 1
